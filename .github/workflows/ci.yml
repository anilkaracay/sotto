name: CI

# A push to main and a pull request run the lightweight parts: lint, typecheck and the unit tests of
# the node job, and the checks job; main's branch protection requires both. The build, the browser
# tests, the program job and the localnet job run by hand (workflow_dispatch), and on the development
# machine with pnpm ci:local:full before every merge (D-25).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGAVE_VERSION: 4.2.2
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Test Postgres for API and database tests, like scripts/db-local.sh test-up (docs/11-TESTING.md).
    services:
      postgres:
        image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 56433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm through corepack (version from packageManager)
        run: |
          corepack enable
          pnpm --version | grep -qx "12.6.0"
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # From here on: manual runs only.
      - run: pnpm build
        if: github.event_name == 'workflow_dispatch'
      - name: The build output holds no env file or server only value
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/checks/build-output.py
      - name: Install the Playwright browser
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @sotto/e2e exec playwright install --with-deps chromium firefox
      # The visual baselines (step 3.8, tests/e2e/visual.ts) are compared in the local CI only
      # (D-25): they are taken on its macOS machine, and this runner's fonts would differ. Here
      # SOTTO_VISUAL is not set, so the specs skip the comparison.
      - name: End to end tests (Playwright)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @sotto/e2e e2e

  program:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: ./.github/actions/setup-agave
        with:
          version: ${{ env.AGAVE_VERSION }}
      # --arch v3: the local validator refuses SBPF v0 to v2 deployments (pnpm program:build).
      - name: Build sotto_proofs (cargo-build-sbf 4.1.0)
        run: cargo-build-sbf --manifest-path programs/sotto_proofs/Cargo.toml --arch v3 -- --locked
      - name: Test sotto_proofs
        run: cargo test --locked -p sotto_proofs
      # The localnet job deploys this build (scripts/bootstrap-localnet.ts).
      - name: Keep the build for the localnet job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sotto-proofs-so
          path: target/deploy/sotto_proofs.so
          if-no-files-found: error
          retention-days: 1

  localnet:
    if: github.event_name == 'workflow_dispatch'
    needs: program
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The worker's localnet tests need the test Postgres too (scripts/db-local.sh test-up locally).
    services:
      postgres:
        image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 56433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm through corepack (version from packageManager)
        run: |
          corepack enable
          pnpm --version | grep -qx "12.6.0"
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-agave
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Default keypair for the Solana CLI (throwaway)
        run: solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
      - name: Fetch the Token Wrap test deployment (hash verified)
        run: scripts/fetch-token-wrap.sh
      - name: The sotto_proofs build of the program job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sotto-proofs-so
          path: target/deploy
      - name: Start localnet
        run: |
          mkdir -p .localnet
          nohup scripts/localnet.sh > .localnet/localnet.log 2>&1 &
      - name: Wait for health
        run: |
          for _ in $(seq 1 120); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' http://127.0.0.1:8899 | grep -q '"ok"'; then
              echo "validator healthy"; exit 0
            fi
            sleep 2
          done
          echo "validator did not become healthy"; exit 1
      - name: Confidential smoke test
        run: scripts/localnet-smoke.sh
      - name: Bootstrap localnet (mints, escrow, SAS; .localnet/bootstrap.json)
        run: node scripts/bootstrap-localnet.ts
      - name: SAS flow and pending credits on localnet (worker, throwaway signer)
        run: pnpm --filter @sotto/worker test:localnet
        env:
          SOTTO_LOCALNET_RPC_URL: http://127.0.0.1:8899
      - name: Transaction rules, startup verification and confidential accounts on localnet (sdk)
        run: pnpm --filter @sotto/sdk test:localnet
        env:
          SOTTO_LOCALNET_RPC_URL: http://127.0.0.1:8899
      - name: Scripts on localnet (recover-balance)
        run: pnpm --filter @sotto/scripts test:localnet
        env:
          SOTTO_LOCALNET_RPC_URL: http://127.0.0.1:8899
      # The browser flows that send transactions (step 1.7) need the production build on this runner.
      - name: Build the web app for the localnet browser flows
        run: pnpm --filter @sotto/web build
      - name: Install the Playwright browser
        run: pnpm --filter @sotto/e2e exec playwright install --with-deps chromium
      - name: Browser flows on localnet (Playwright, injected test wallet)
        run: pnpm --filter @sotto/e2e e2e:localnet
      - name: Upload validator logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localnet-logs
          path: |
            .localnet/localnet.log
            .localnet/ledger/validator.log
          if-no-files-found: ignore

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No en or em dash in tracked files or the commit message
        run: python3 scripts/checks/no-dashes.py "${{ github.event.pull_request.head.sha || github.sha }}"
      # The AC checker reads test titles with the TypeScript compiler (scripts/checks/test-titles.ts).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm through corepack (version from packageManager)
        run: |
          corepack enable
          pnpm --version | grep -qx "12.6.0"
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Tests of the AC checker
        run: python3 -m unittest discover -s scripts/checks -p "test_*.py"
      - name: AC manifest for the current phase (test titles only)
        run: python3 scripts/checks/ac-manifest.py --list
      - name: Invariants I-1 to I-11 each with their tests and checks (step 3.9)
        run: python3 scripts/checks/invariants.py
      - name: The logo components match the brand kit (step 4.2.1)
        run: node scripts/generate-brand.ts --check
      - name: Invariant I-4 (no ZK Token Proof program ID)
        run: scripts/checks/no-zk-token-proof.sh
      - name: No env file is tracked or in the Docker build context
        run: scripts/checks/env-files.sh
      - name: Install gitleaks (release tarball, SHA-256 verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Secret scan over the full history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .
