name: CI

# Manual runs only while the repository is private (D-25). The push and pull_request triggers are
# restored by the public launch checklist (docs/12-MILESTONES.md).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGAVE_VERSION: 4.2.2
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm through corepack (version from packageManager)
        run: |
          corepack enable
          pnpm --version | grep -qx "12.6.0"
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: ./.github/actions/setup-agave
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Build sotto_proofs (cargo-build-sbf 4.1.0)
        run: cargo-build-sbf --manifest-path programs/sotto_proofs/Cargo.toml -- --locked
      - name: Test sotto_proofs
        run: cargo test --locked -p sotto_proofs

  localnet:
    needs: program
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-agave
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Default keypair for the Solana CLI (throwaway)
        run: solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
      - name: Fetch the Token Wrap test deployment (hash verified)
        run: scripts/fetch-token-wrap.sh
      - name: Start localnet
        run: |
          mkdir -p .localnet
          nohup scripts/localnet.sh > .localnet/localnet.log 2>&1 &
      - name: Wait for health
        run: |
          for _ in $(seq 1 120); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' http://127.0.0.1:8899 | grep -q '"ok"'; then
              echo "validator healthy"; exit 0
            fi
            sleep 2
          done
          echo "validator did not become healthy"; exit 1
      - name: Confidential smoke test
        run: scripts/localnet-smoke.sh
      - name: Upload validator logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localnet-logs
          path: |
            .localnet/localnet.log
            .localnet/ledger/validator.log
          if-no-files-found: ignore

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No en or em dash in tracked files or the commit message
        run: python3 scripts/checks/no-dashes.py "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: AC manifest for the current phase
        run: python3 scripts/checks/ac-manifest.py
      - name: Invariant I-4 (no ZK Token Proof program ID)
        run: scripts/checks/no-zk-token-proof.sh
      - name: Install gitleaks (release tarball, SHA-256 verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Secret scan over the full history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .
