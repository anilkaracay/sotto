# gitleaks configuration: the default rules plus a narrow allowlist of public Solana addresses.
# Program IDs are public onchain data, not secrets. The generic-api-key rule flags them when the
# variable name contains "token". Add an address here only if it is public (docs/02-VERIFIED-FACTS.md).
[extend]
useDefault = true

[[allowlists]]
description = "Public Solana program IDs (facts C8)"
regexes = [
  '''^EEvqpjNRQkNRwXzVziuTGGi1wYDiPv7haYVVu3XZCoQn$''',
]
