# gitleaks configuration: the default rules plus a narrow allowlist of public Solana addresses and keys.
# Addresses are public onchain data, not secrets. The generic-api-key rule flags them when the
# variable name contains a keyword such as "token" or "credential". Add an address here only if it is
# public and recorded in docs/02-VERIFIED-FACTS.md.
[extend]
useDefault = true

[[allowlists]]
description = "Public Solana addresses and keys (facts A11, C8, D5, E7)"
regexes = [
  # Sotto devnet test deployment of Token Wrap (C8).
  '''^EEvqpjNRQkNRwXzVziuTGGi1wYDiPv7haYVVu3XZCoQn$''',
  # Wallet A, the Token Wrap upgrade authority (C8), used as a test address.
  '''^7SSpLJh516AbWiV5GM7ooZFTHoQN64pdohYxbDs3Gq4L$''',
  # Sotto SAS credential on devnet (E7).
  '''^4KX4P7he62x5x8X35vubNNhJRhV4vJXPGNsc8skPyKFT$''',
  # ElGamal public key of the step 1.5 CLI check test keypair (A11); tests compare derived keys with it.
  '''^BxMVLbjVntF9DJtDjfpQLrgw4hopedMgNkZZKGcVkZp6$''',
  # The associated account of the wallet lab probe R13 (step 2.1, D5), named R13_TOKEN_ACCOUNT.
  '''^4QHNHpkTVwssfTGM4ygotqKnf7Qiwq5FWifh9D16Z8aQ$''',
]

[[allowlists]]
description = "Fixed uuids of test data (steps 1.9 and 1.10): the generic-api-key rule flags a uuid named idempotency_key or idempotencyKey"
regexes = [
  # A made up uuid in packages/sdk/test/approvals.test.ts (also an org id in apps/web tests).
  '''^7c2a9e41-1b2c-4f0e-8a77-3d5e6f708192$''',
  # A made up idempotency key in apps/web/test/overview-ui.test.tsx (step 1.10).
  '''^0d1e2f3a-4b5c-4d6e-8f70-8192a3b4c5d6$''',
]
