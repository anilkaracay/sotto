packages:
  - apps/*
  - packages/*
  - scripts
  - tests/e2e

# Exact versions, resolved at scaffold time (docs/VERSIONS.md). Packages reference them with "catalog:".
catalog:
  "@eslint/js": 10.0.1
  "@next/eslint-plugin-next": 16.3.6
  "@playwright/test": 1.63.0
  "@solana-program/system": 0.15.0
  "@solana-program/token-2022": 0.19.0
  "@solana-program/token-wrap": 2.7.1
  "@solana-program/zk-elgamal-proof": 0.4.0
  "@solana/kit": 8.3.0
  "@solana/react": 8.3.0
  "@solana/sysvars": 8.3.0
  "@solana/wallet-standard-features": 1.5.0
  "@solana/wallet-standard-util": 1.1.4
  "@solana/zk-sdk": 0.5.3
  "@types/node": 24.19.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@wallet-standard/react": 1.0.3
  dotenv: 18.0.4
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  eslint-plugin-react-hooks: 7.1.1
  eslint: 10.11.0
  globals: 17.12.0
  libsodium-wrappers-sumo: 0.8.4
  next: 16.3.6
  postgres: 3.4.9
  prettier: 3.9.9
  react-dom: 19.3.0
  react: 19.3.0
  sas-lib: 1.0.10
  turbo: 2.11.4
  typescript-eslint: 8.70.1
  typescript: 6.0.3
  vite: 8.3.1
  vitest: 5.0.2
  zod: 4.6.5

minimumReleaseAgeExclude:
  - "@types/node@24.19.0"

# Dependency build scripts, reviewed (pnpm strictDepBuilds). esbuild (drizzle-kit, tsx) is denied: its
# postinstall only checks and links the platform binary, which pnpm installs as the optional
# @esbuild/<platform> package; drizzle-kit generate works without it (VERIFICATION-LOG step 1.2).
allowBuilds:
  esbuild: false
