[package]
name = "g4_probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Gate G4 probe (step 2.2): the checks 4 to 9 of sotto_proofs::verify_balance_threshold on real accounts, to measure compute units. Local validator only, never deployed elsewhere."

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

# The crates G4 confirmed from source for the pinned spl-token-2022 11.1.0 tree (VERIFICATION-LOG
# step 2.2): the interface crates it resolves, not spl-token-2022 or solana-zk-sdk themselves.
[dependencies]
bytemuck = "=1.25.0"
solana-account-info = "=3.1.1"
solana-address = { version = "=2.8.0", features = ["decode"] }
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-zk-elgamal-proof-interface = "=0.1.3"
solana-zk-sdk-pod = "=0.1.2"
spl-token-2022-interface = "=3.1.2"
spl-token-confidential-transfer-ciphertext-arithmetic = "=0.5.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
