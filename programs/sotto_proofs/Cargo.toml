[package]
name = "sotto_proofs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Verifies confidential balance thresholds and writes proof records (docs/05-ONCHAIN-PROGRAM.md). Native program, D-16."

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Checked by the solana-program-entrypoint macros; unused (default heap and panic handler).
custom-heap = []
custom-panic = []

[dependencies]
bytemuck = "=1.25.2"
solana-account-info = "=3.1.1"
solana-address = { version = "=2.8.0", features = ["decode"] }
solana-clock = "=3.2.1"
solana-cpi = "=3.1.0"
solana-define-syscall = "=4.0.1"
solana-instruction = "=3.5.1"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-rent = "=3.1.0"
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = "=3.1.0"
solana-system-interface = "=3.3.0"
solana-sysvar = "=3.1.1"
solana-zk-elgamal-proof-interface = "=0.1.3"
solana-zk-sdk-pod = "=0.1.2"
spl-token-2022-interface = "=3.1.2"
spl-token-confidential-transfer-ciphertext-arithmetic = "=0.5.1"

# Off chain (tests and tools) the PDA functions need the curve library; onchain they are syscalls.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "=2.8.0", features = ["decode", "curve25519"] }

[dev-dependencies]
proptest = "=1.11.0"
solana-account = "=4.7.0"
solana-instruction-error = "=2.5.0"
solana-keypair = "=3.1.2"
serde_json = "=1.0.151"
solana-program-pack = "=3.1.0"
solana-signature = "=3.6.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
solana-transaction-error = "=3.4.0"
solana-program-test = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-zk-sdk = "=7.0.1"
spl-token-confidential-transfer-proof-generation = "=0.6.1"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
